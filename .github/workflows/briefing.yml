name: Marketing Briefing Pipeline

on:
  schedule:
    # 22:00 UTC Sun/Tue/Thu == 07:00 KST Mon/Wed/Fri
    - cron: '0 22 * * 0,2,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (skip actual email/kakao send)'
        required: false
        default: 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TIMEZONE: Asia/Seoul
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_RECIPIENT_EMAIL: ${{ secrets.BRIEFING_RECIPIENT_EMAIL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          MAGIC_LINK_SECRET: ${{ secrets.MAGIC_LINK_SECRET }}
          MIN_SELECT: ${{ vars.MIN_SELECT || '7' }}
          MAX_SELECT: ${{ vars.MAX_SELECT || '10' }}
          MIN_SCORE_THRESHOLD: ${{ vars.MIN_SCORE_THRESHOLD || '60' }}
          WEIGHT_MIN_SAMPLES: ${{ vars.WEIGHT_MIN_SAMPLES || '5' }}
          WEIGHT_MAX_ADJUSTMENT: ${{ vars.WEIGHT_MAX_ADJUSTMENT || '5' }}
          RESEND_GUARD_DAYS: ${{ vars.RESEND_GUARD_DAYS || '7' }}
        run: python -m pipeline.run_pipeline
