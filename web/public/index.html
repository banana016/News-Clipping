<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브랜드 전략 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#fbfbfd; --surface:#ffffff; --surface-2:#f5f5f7; --line:#d2d2d7;
    --ink:#1d1d1f; --ink-soft:#6e6e73; --ink-faint:#86868b;
    --accent:#0071e3; --accent-hover:#0077ed;
    --good-fill:#248a3d; --good-fill-ink:#fff;
    --bad-fill:#d70015; --bad-fill-ink:#fff;
    --kakao:#FEE500; --kakao-ink:#191919;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px 90px;}
  .hero{text-align:center;margin-bottom:24px;}
  h1{font-size:32px;font-weight:700;letter-spacing:-.015em;margin:0 0 8px;}
  .sub{font-size:15px;color:var(--ink-soft);}
  .date-line{font-size:13px;color:var(--ink-faint);font-weight:500;text-align:center;margin-bottom:10px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat-tile{background:var(--surface-2);border:none;border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer;font-family:inherit;}
  .stat-tile:hover{background:#ececef;}
  .stat-num{font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .stat-caret{font-size:11px;color:var(--accent);margin-top:6px;font-weight:600;}
  .mini-panel{margin-bottom:20px;}
  .cards{display:flex;flex-direction:column;gap:14px;margin-bottom:24px;}
  .card,.review-card{background:var(--surface);border-radius:18px;padding:22px 22px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:10px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .tag{font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-soft);padding:3px 9px;border-radius:999px;}
  .reason-badge{background:#FFF1DC;color:#9A5B00;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .score-text{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  h3,h4{font-size:17px;font-weight:700;margin:0 0 8px;}
  p.body-text{font-size:13.6px;line-height:1.6;color:var(--ink-soft);margin:0 0 10px;}
  .meta{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;}
  .link{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;}
  .fb-group{display:flex;align-items:center;gap:8px;}
  .fb-btn{appearance:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:none;background:var(--surface-2);color:var(--ink-soft);}
  .fb-btn[data-active="true"][data-value="good"]{background:var(--good-fill);color:var(--good-fill-ink);}
  .fb-btn[data-active="true"][data-value="bad"]{background:var(--bad-fill);color:var(--bad-fill-ink);}
  .kakao-panel,.panel{background:var(--surface-2);border-radius:18px;padding:20px 22px;margin-bottom:16px;}
  .kakao-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .kakao-btn{appearance:none;border:none;cursor:pointer;font-family:inherit;background:var(--kakao);color:var(--kakao-ink);font-size:14px;font-weight:700;padding:11px 20px;border-radius:980px;white-space:nowrap;}
  .kakao-btn:disabled{opacity:.45;cursor:not-allowed;}
  .msg-status{font-size:12.5px;color:var(--ink-soft);margin-top:10px;}
  .full-text-box{margin-top:14px;}
  .full-text-pre{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.6;color:var(--ink);max-height:420px;overflow-y:auto;margin:0 0 10px;}
  .copy-btn{appearance:none;border:1px solid var(--line);cursor:pointer;font-family:inherit;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:9px 16px;border-radius:980px;}
  .copy-btn:disabled{opacity:.45;cursor:not-allowed;}
  .state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;}
  .footnote{margin-top:8px;font-size:11.5px;color:var(--ink-faint);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>브랜드 전략 브리핑</h1>
    <div class="sub">마케팅·브랜드 전략 뉴스, 읽고 도움된 기사만 카카오톡으로</div>
  </div>
  <div id="app"><div class="state">불러오는 중…</div></div>
</div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const app = document.getElementById('app');

  function api(path, opts) {
    const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
    return fetch(url, opts).then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || r.statusText); });
      return r.json();
    });
  }
  function post(path, body) {
    return fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: token }, body)),
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || r.statusText); });
      return r.json();
    });
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function copyText(text) {
    const status = document.getElementById('copyStatus');
    function ok() { if (status) status.textContent = '복사되었습니다.'; }
    function fail() { if (status) status.textContent = '복사 실패: 텍스트를 직접 선택해 복사해 주세요.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(fail);
      return;
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok();
    } catch (err) {
      fail();
    }
  }

  if (!token) {
    app.innerHTML = '<div class="state">유효한 링크가 아닙니다. 이메일에서 받은 링크로 다시 접속해 주세요.</div>';
    return;
  }

  api('/api/briefing').then(render).catch(function (err) {
    app.innerHTML = '<div class="state">불러오지 못했습니다: ' + err.message + '<br>링크가 만료되었을 수 있습니다. 최신 메일의 링크로 다시 시도해 주세요.</div>';
  });

  function evalOf(row) {
    return row.evaluations || {};
  }

  function tagsHtml(tags) {
    return (tags || []).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('');
  }

  function fbGroup(articleId, rating) {
    var goodActive = rating === 'good', badActive = rating === 'bad';
    var stateText = rating === 'good' ? '평가: 도움됨' : (rating === 'bad' ? '평가: 별로예요' : '아직 평가하지 않음');
    return '<div class="fb-group">' +
      '<span class="msg-status">' + stateText + '</span>' +
      '<button class="fb-btn" data-article="' + articleId + '" data-value="good" data-active="' + goodActive + '">도움됨</button>' +
      '<button class="fb-btn" data-article="' + articleId + '" data-value="bad" data-active="' + badActive + '">별로예요</button>' +
      '</div>';
  }

  function render(data) {
    const run = data.run;
    const ratings = {}; // client-local optimistic state, article_id -> 'good'|'bad'

    app.innerHTML =
      '<div class="date-line">' + run.run_date + '</div>' +
      '<div class="stat-row">' +
        '<div class="stat-tile"><div class="stat-num">' + run.collected_n + '</div><div class="stat-label">수집</div></div>' +
        '<button class="stat-tile" id="tileReview"><div class="stat-num">' + run.reviewed_n + '</div><div class="stat-label">검토</div><div class="stat-caret">예시 보기</div></button>' +
        '<button class="stat-tile" id="tileFinal"><div class="stat-num">' + run.selected_n + '</div><div class="stat-label">최종 선정</div><div class="stat-caret">아래로 이동</div></button>' +
      '</div>' +
      '<div class="mini-panel" id="reviewPanel" hidden></div>' +
      '<div class="cards" id="cards"></div>' +
      '<div class="kakao-panel">' +
        '<div class="kakao-head">' +
          '<div><h4 style="margin:0 0 4px;">선택한 기사 전문보기</h4>' +
          '<div class="sub" style="font-size:12.5px;">도움됨 표시한 기사 전문을 모아 보여드립니다. 복사해서 카카오톡에 직접 붙여넣어 주세요.</div></div>' +
          '<button class="kakao-btn" id="kakaoBtn">전문보기</button>' +
        '</div>' +
        '<div class="msg-status" id="kakaoStatus"></div>' +
        '<div class="full-text-box" id="fullTextBox" hidden></div>' +
      '</div>' +
      '<div class="footnote">기사 원문 전문은 저장하지 않으며, 제목·요약·링크·메타데이터만 보관합니다.</div>';

    function renderCards() {
      document.getElementById('cards').innerHTML = data.selected.map(function (row) {
        const e = evalOf(row);
        return '<article class="card" data-id="' + row.id + '">' +
          '<div class="tags">' + tagsHtml(e.tags) + '</div>' +
          '<h3>' + row.title + '</h3>' +
          '<p class="body-text">' + (e.summary || '') + ' ' + (e.interpretation || '') + '</p>' +
          '<div class="meta">' + row.source + ' · ' + new Date(row.published_at).toLocaleString('ko-KR') + ' · ' + e.final_score + '점</div>' +
          '<div class="card-foot"><a class="link" href="' + row.url + '" target="_blank" rel="noopener">원문보기 ↗</a>' +
          fbGroup(row.id, ratings[row.id]) + '</div></article>';
      }).join('');
      attachFeedback();
    }

    function renderReview() {
      document.getElementById('reviewPanel').innerHTML = data.reviewed.map(function (row) {
        const e = evalOf(row);
        return '<div class="review-card" data-id="' + row.id + '">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
          '<span class="reason-badge">' + (e.reject_reason || '탈락') + '</span>' +
          '<span class="score-text">점수 ' + e.final_score + '/100</span></div>' +
          '<div class="tags">' + tagsHtml(e.tags) + '</div>' +
          '<h4>' + row.title + '</h4>' +
          '<div class="meta">' + row.source + '</div>' +
          '<div class="card-foot"><a class="link" href="' + row.url + '" target="_blank" rel="noopener">원문보기 ↗</a>' +
          fbGroup(row.id, ratings[row.id]) + '</div></div>';
      }).join('');
      attachFeedback();
    }

    function attachFeedback() {
      document.querySelectorAll('.fb-btn').forEach(function (btn) {
        btn.onclick = function () {
          const id = btn.getAttribute('data-article');
          const value = btn.getAttribute('data-value');
          const next = ratings[id] === value ? undefined : value;
          ratings[id] = next;
          if (next) {
            post('/api/feedback', { article_id: id, rating: next })
              .catch(function (err) { console.error(err); });
          }
          renderCards(); renderReview();
        };
      });
    }

    document.getElementById('tileReview').onclick = function () {
      const panel = document.getElementById('reviewPanel');
      panel.hidden = !panel.hidden;
      if (!panel.hidden) renderReview();
    };
    document.getElementById('tileFinal').onclick = function () {
      document.getElementById('cards').scrollIntoView({ behavior: 'smooth' });
    };
    document.getElementById('kakaoBtn').onclick = function () {
      const btn = document.getElementById('kakaoBtn');
      const status = document.getElementById('kakaoStatus');
      const box = document.getElementById('fullTextBox');
      btn.disabled = true;
      status.textContent = '불러오는 중…';
      api('/api/liked-full-text').then(function (res) {
        if (!res.count) {
          status.textContent = res.message || '도움됨으로 표시된 기사가 없습니다.';
          box.hidden = true;
          box.innerHTML = '';
          return;
        }
        status.textContent = res.count + '건의 기사 전문입니다. 복사해서 카카오톡에 붙여넣어 주세요.';
        box.hidden = false;
        box.innerHTML = '<pre class="full-text-pre">' + escapeHtml(res.text) + '</pre>' +
          '<button class="copy-btn" id="copyBtn">전문복사</button>' +
          '<span class="msg-status" id="copyStatus" style="margin-left:8px;display:inline-block;"></span>';
        document.getElementById('copyBtn').onclick = function () { copyText(res.text); };
      }).catch(function (err) {
        status.textContent = '불러오기 실패: ' + err.message;
        box.hidden = true;
      }).finally(function () { btn.disabled = false; });
    };

    renderCards();
  }
})();
</script>
</body>
</html>
